name: Weekly Security Patch Deploy

on:
  schedule:
    # Run at 00:00 every Sunday (UTC), which is 07:00 Sunday in Vietnam time
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  security-patch-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: hoan171188
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Set up Docker Buildx for optimization
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build and Push Backend Image with latest base image updates
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          pull: true # Force pulling the latest base image to apply security patches
          tags: hoan171188/nongsanlongan:backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Build and Push Frontend Image with latest base image updates
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          pull: true # Force pulling the latest base image to apply security patches
          tags: hoan171188/nongsanlongan:frontend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. SSH into VPS and deploy patched images
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to the project directory on VPS
            cd /home/hoan/nongsansachvinhlong
            
            # Pull the latest configuration files from GitHub (docker-compose.yml, Caddyfile, etc.)
            git pull origin main
            
            # Pull the latest Docker images from Docker Hub
            docker compose pull
            
            # Restart the containers in detached mode (automatically reading environment variables from .env on VPS)
            docker compose up -d
            
            # Remove unused and dangling Docker images to free disk space
            docker image prune -f
