name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: hoan171188
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Set up Docker Buildx for optimization
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build and Push Backend Image
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: hoan171188/nongsanlongan:backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Build and Push Frontend Image
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: hoan171188/nongsanlongan:frontend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. SSH into VPS and deploy pre-built images
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Di chuyển vào thư mục chứa docker-compose trên VPS
            cd /home/hoan/nongsansachvinhlong
            
            # Cập nhật cấu hình mới nhất từ GitHub (docker-compose.yml, Caddyfile,...)
            git pull origin main
            
            # Đăng nhập Docker Hub trên VPS để tải image Private (nếu có)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u hoan171188 --password-stdin
            
            # Kéo (pull) các image mới nhất vừa build từ Docker Hub về VPS
            docker compose pull
            
            # Khởi chạy lại các container ở chế độ chạy ngầm (detached)
            # Docker Compose sẽ tự động đọc cấu hình môi trường từ file .env đang nằm sẵn trên VPS
            docker compose up -d
            
            # Dọn dẹp các Docker image cũ không còn sử dụng để giải phóng dung lượng ổ cứng
            docker image prune -f
