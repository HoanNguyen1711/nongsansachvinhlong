name: Deploy to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Caddyfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: hoan171188
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Set up Docker Buildx for optimization
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Build and Push Backend Image
      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: hoan171188/nongsanlongan:backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Build and Push Frontend Image
      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: hoan171188/nongsanlongan:frontend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. SSH into VPS and deploy pre-built images
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to the project directory on VPS
            cd /home/hoan/nongsansachvinhlong
            
            # Pull the latest configuration files from GitHub (docker-compose.yml, Caddyfile, etc.)
            git pull origin main
            
            # Pull the latest Docker images from Docker Hub
            docker compose pull
            
            # Restart the containers in detached mode (automatically reading environment variables from .env on VPS)
            docker compose up -d
            
            # Remove unused and dangling Docker images to free disk space
            docker image prune -f

      # 7. Send notification to Discord
      - name: Discord Notification
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Deploy to VPS (Code Change)"
