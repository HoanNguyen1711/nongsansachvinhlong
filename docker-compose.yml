services:
  backend:
    image: hoan171188/nongsanlongan:backend
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///data/nongsan.db}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/static/uploads}
      - JWT_SECRET=${JWT_SECRET:-YOUR_SECURE_RANDOM_SECRET_KEY_GOES_HERE}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    volumes:
      - sqlite_data:/app/data
      - uploads_data:/app/static/uploads
    ports:
      - "8000:8000"

  frontend:
    image: hoan171188/nongsanlongan:frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - uploads_data:/var/www/static/uploads  # Mount static uploads directory for Caddy file server
    depends_on:
      - backend
      - frontend

volumes:
  sqlite_data:
  uploads_data:
  caddy_data:
  caddy_config:
