services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nongsan_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_here}
      POSTGRES_DB: ${POSTGRES_DB:-nongsan_db}
    command: >
      postgres 
      -c shared_buffers=64MB 
      -c work_mem=4MB 
      -c max_connections=50
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    volumes:
      - pg_data:/var/lib/postgresql

  backend:
    image: hoan171188/nongsanlongan:backend
    build: ./backend
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+pg8000://nongsan_user:secure_password_here@db:5432/nongsan_db}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/static/uploads}
      - JWT_SECRET=${JWT_SECRET:-YOUR_SECURE_RANDOM_SECRET_KEY_GOES_HERE}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    volumes:
      - uploads_data:/app/static/uploads
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    image: hoan171188/nongsanlongan:frontend
    build: ./frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - uploads_data:/var/www/static/uploads  # Mount static uploads directory for Caddy file server
    depends_on:
      - backend
      - frontend

volumes:
  pg_data:
  uploads_data:
  caddy_data:
  caddy_config:
